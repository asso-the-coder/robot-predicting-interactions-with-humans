processed_dir: data/processed/windows/pose_2s
output_root: outputs
seed: 360
device: auto
model:
  model_size: 64
  num_heads: 4
  num_layers: 2
  feedforward_size: 128
  dropout: 0.25
  max_sequence_length: 32
training:
  batch_size: 512
  epochs: 30
  learning_rate: 0.0005
  weight_decay: 0.001
  gradient_clip_norm: 1.0
  early_stopping_patience: 7
  num_workers: 0
  positive_weight: auto
threshold_selection:
  minimum: 0.05
  maximum: 0.95
  step: 0.01
